<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TNEA Counselling Assistant</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef4fb;
}

/* CHATBOT */

.chat-container{
    position:fixed;
    right:25px;
    bottom:25px;
    width:380px;
    height:650px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

/* HEADER */

.chat-header{
    height:120px;
    background:linear-gradient(135deg,#142452,#128bd0);
    color:white;
    display:flex;
    align-items:center;
    padding:18px;
    gap:14px;
}

.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.header-text h2{
    font-size:20px;
}

.header-text p{
    font-size:13px;
    margin-top:4px;
    color:#dceeff;
}

.online{
    margin-top:6px;
    font-size:12px;
}

.online span{
    color:#24df75;
}

.close{
    margin-left:auto;
    font-size:25px;
}

/* BODY */

.chat-body{
    height:390px;
    padding:18px;
    overflow-y:auto;
}

.bot-message{
    background:#202f63;
    color:white;
    padding:15px;
    border-radius:18px 18px 18px 5px;
    width:90%;
    line-height:1.5;
    margin-bottom:15px;
    font-size:14px;
}

.user-message{
    background:#e8f2ff;
    color:#172653;
    padding:12px 15px;
    border-radius:18px 18px 5px 18px;
    width:max-content;
    max-width:80%;
    margin-left:auto;
    margin-bottom:12px;
}

/* QUICK BUTTONS */

.quick-buttons{
    padding:10px 15px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    border-top:1px solid #eee;
}

.quick-buttons button{
    border:1px solid #ddd;
    background:white;
    padding:9px 13px;
    border-radius:20px;
    color:#1d2d59;
    font-weight:bold;
    cursor:pointer;
}

.quick-buttons button:hover{
    background:#1d2d59;
    color:white;
}

/* INPUT */

.input-area{
    display:flex;
    padding:12px 15px;
    gap:8px;
}

.input-area input{
    flex:1;
    border:0;
    outline:none;
    background:#f0f4fa;
    border-radius:30px;
    padding:15px;
}

.send{
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:#ffd85c;
    font-size:20px;
    cursor:pointer;
}

@media(max-width:500px){

    .chat-container{
        right:10px;
        bottom:10px;
        width:calc(100% - 20px);
    }

}

</style>
</head>

<body>

<div class="chat-container">

    <!-- HEADER -->

    <div class="chat-header">

        <div class="avatar">
            🎓
        </div>

        <div class="header-text">

            <h2>TNEA Assistant</h2>

            <p>Engineering Counselling Support</p>

            <div class="online">
                <span>●</span> Online now
            </div>

        </div>

        <div class="close">×</div>

    </div>


    <!-- CHAT -->

    <div class="chat-body" id="chatBody">

        <div class="bot-message">

            Hi! 👋 I'm your <b>TNEA Counselling Assistant.</b>
            <br><br>

            I can help you with:
            <br>
            • TNEA Registration
            <br>
            • Rank & Cutoff
            <br>
            • College Selection
            <br>
            • Branch Selection
            <br>
            • Choice Filling
            <br>
            • Allotment
            <br>
            • Certificates

        </div>

    </div>


    <!-- QUICK OPTIONS -->

    <div class="quick-buttons">

        <button onclick="quick('TNEA Registration')">
            Registration
        </button>

        <button onclick="quick('TNEA Rank')">
            Rank
        </button>

        <button onclick="quick('Cutoff')">
            Cutoff
        </button>

        <button onclick="quick('Choice Filling')">
            Choice Filling
        </button>

        <button onclick="quick('College Selection')">
            Colleges
        </button>

        <button onclick="quick('Allotment')">
            Allotment
        </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Ask about TNEA counselling..."
            onkeypress="enterKey(event)"
        >

        <button class="send" onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<script>

function sendMessage(){

    let input=document.getElementById("userInput");

    let message=input.value.trim();

    if(message==="") return;

    addUser(message);

    input.value="";

    setTimeout(function(){

        botReply(message);

    },500);

}


function quick(message){

    addUser(message);

    setTimeout(function(){

        botReply(message);

    },500);

}


function addUser(message){

    let body=document.getElementById("chatBody");

    let div=document.createElement("div");

    div.className="user-message";

    div.innerText=message;

    body.appendChild(div);

    body.scrollTop=body.scrollHeight;

}


function addBot(message){

    let body=document.getElementById("chatBody");

    let div=document.createElement("div");

    div.className="bot-message";

    div.innerHTML=message;

    body.appendChild(div);

    body.scrollTop=body.scrollHeight;

}


function botReply(message){

    let text=message.toLowerCase();

    let reply="";


    /* REGISTRATION */

    if(text.includes("registration")){

        reply=`
        📝 <b>TNEA Registration</b><br><br>

        You need to register through the official
        TNEA portal and upload the required certificates.
        <br><br>

        After registration, certificate verification and
        rank list publication will take place.
        `;

    }


    /* RANK */

    else if(text.includes("rank")){

        reply=`
        📊 <b>TNEA Rank</b><br><br>

        TNEA publishes the overall rank and community rank.
        <br><br>

        You can use your rank to understand your
        possible college and branch choices.
        `;

    }


    /* CUTOFF */

    else if(text.includes("cutoff")){

        reply=`
        📈 <b>TNEA Cutoff</b><br><br>

        Enter your cutoff mark and category to
        find suitable colleges and branches.
        <br><br>

        You can also check previous TNEA cutoff data.
        `;

    }


    /* CHOICE FILLING */

    else if(text.includes("choice") ||
            text.includes("filling")){

        reply=`
        🎯 <b>Choice Filling</b><br><br>

        Select your preferred colleges and branches
        in your desired order.
        <br><br>

        ⭐ Important: The order of your choices matters.
        `;

    }


    /* COLLEGE */

    else if(text.includes("college")){

        reply=`
        🏫 <b>College Selection</b><br><br>

        I can help you shortlist colleges based on:
        <br><br>

        • TNEA Rank<br>
        • Cutoff<br>
        • Category<br>
        • Branch<br>
        • College preference
        `;

    }


    /* BRANCH */

    else if(text.includes("branch") ||
            text.includes("course")){

        reply=`
        💻 <b>Branch Selection</b><br><br>

        Popular engineering branches include:
        <br><br>

        • CSE<br>
        • AI & ML<br>
        • ECE<br>
        • EEE<br>
        • Mechanical<br>
        • Civil<br>
        • IT
        `;

    }


    /* ALLOTMENT */

    else if(text.includes("allotment")){

        reply=`
        🎓 <b>TNEA Allotment</b><br><br>

        After choice filling, seats are allotted
        based on rank, category, availability and
        your choice order.
        <br><br>

        You then need to confirm the allotment
        according to the counselling instructions.
        `;

    }


    /* CERTIFICATE */

    else if(text.includes("certificate") ||
            text.includes("document")){

        reply=`
        📄 <b>Certificates</b><br><br>

        TNEA requires candidates to upload
        relevant certificates during the application
        and verification process.
        <br><br>

        Make sure your documents are clear and valid.
        `;

    }


    /* HELP */

    else{

        reply=`
        😊 I can help you with:

        <br><br>

        📝 Registration<br>
        📊 Rank<br>
        📈 Cutoff<br>
        🏫 College Selection<br>
        💻 Branch Selection<br>
        🎯 Choice Filling<br>
        🎓 Allotment<br>
        📄 Certificates

        <br><br>

        Try asking:
        <b>"How does choice filling work?"</b>
        `;

    }


    addBot(reply);

}


function enterKey(event){

    if(event.key==="Enter"){

        sendMessage();

    }

}

</script>

</body>
</html>
